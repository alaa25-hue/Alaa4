<style>
:root{--ink:#3b2a5c;--paper:#fffafd;--soft:#fdeefa;--pink:#ff7eb6;--blue:#7aa7ff;--g1:#ffc6e3;--g2:#d9c6ff;--g3:#b9d4ff;--line:#ead7f3;--grid:rgba(255,255,255,.4);--bar:#7aa7ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Tajawal',sans-serif;font-weight:500;color:var(--ink);min-height:100vh;background:linear-gradient(180deg,var(--g1),var(--g2) 55%,var(--g3));background-attachment:fixed;padding:12px 12px 40px;image-rendering:pixelated}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto}
.px{font-family:'Press Start 2P',monospace;font-size:10px}
.num{font-family:'VT323',monospace;font-size:22px;line-height:1}
.win{background:var(--paper);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);margin-bottom:18px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(90deg,var(--pink),var(--blue));color:#fff;padding:6px 10px;border-bottom:3px solid var(--ink);font-weight:800;font-size:15px;text-shadow:1px 1px 0 var(--ink)}
.bar i{display:flex;gap:4px}.bar i b{width:12px;height:12px;background:var(--paper);border:2px solid var(--ink);display:block}
.body{padding:12px}
h1{margin:0;font-size:22px;font-weight:800}
.hero{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.btn{font:800 14px 'Tajawal',sans-serif;color:var(--ink);background:var(--soft);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:6px 12px;cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.main{background:var(--pink);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px dashed var(--blue);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--soft);border:3px solid var(--ink);padding:6px;text-align:center}
.stat small{display:block;font-size:12px}
.xp{height:20px;border:3px solid var(--ink);background:var(--paper);margin-top:10px;position:relative}
.xp div{height:100%;background:repeating-linear-gradient(90deg,var(--pink) 0 8px,var(--blue) 8px 16px);transition:width .4s steps(8)}
.tabs{display:flex;gap:4px;margin-bottom:-3px;position:relative;z-index:2;overflow-x:auto}
.tab{flex:1;white-space:nowrap;font:800 14px 'Tajawal',sans-serif;color:var(--ink);background:var(--g3);border:3px solid var(--ink);border-bottom:0;padding:8px 6px;cursor:pointer}
.tab.on{background:var(--paper)}
.pane{display:none}.pane.on{display:block}
.set{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.set label{display:flex;align-items:center;gap:6px;font-weight:800}
select,input[type=text],textarea{font:500 15px 'Tajawal',sans-serif;color:var(--ink);background:var(--paper);border:3px solid var(--ink);padding:5px 8px}
input[type=text]{flex:1;min-width:120px}
.step{display:flex;align-items:center;gap:6px}.step .btn{padding:0 10px;font-size:18px}
.scroll{overflow-x:auto;border:3px solid var(--ink);background:var(--paper)}
.row{display:grid;grid-template-columns:130px repeat(var(--n),26px);align-items:center;border-bottom:2px solid var(--line);min-width:max-content}
.row>*{height:30px;display:flex;align-items:center;justify-content:center}
.hn{position:sticky;right:0;background:var(--soft);justify-content:space-between!important;padding:0 6px;font-weight:800;font-size:13px;border-left:3px solid var(--ink);z-index:1;gap:4px}
.hn span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.x{background:none;border:0;color:var(--ink);cursor:pointer;font-size:16px;padding:0}
.dh{font-family:'VT323',monospace;font-size:17px}
.dh.t{background:var(--pink);color:#fff}
.c{width:20px;height:20px;border:2px solid var(--ink);background:var(--paper);cursor:pointer;padding:0;color:#fff;font:800 13px/1 'Tajawal'}
.c.on{background:var(--c)}
.c.off,.c.fut{border-color:var(--line);background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px);cursor:not-allowed}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.ic{display:flex;gap:4px;flex-wrap:wrap}.ic button{font-size:18px;background:var(--paper);border:3px solid var(--line);cursor:pointer;padding:1px 4px}.ic button.on{border-color:var(--ink);background:var(--soft)}
.chartbox{overflow-x:auto;border:3px solid var(--ink);background:var(--paper)}
svg text{font-family:'VT323',monospace}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:13px;font-weight:800}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-left:5px;background:var(--k);border:2px solid var(--ink)}
.empty{text-align:center;padding:24px 8px;font-weight:800}
.moods{display:flex;gap:6px;margin:8px 0}.moods button{font-size:22px;background:var(--paper);border:3px solid var(--line);cursor:pointer}.moods button.on{border-color:var(--ink);background:var(--soft)}
textarea{width:100%;min-height:110px;resize:vertical;background:repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px);line-height:28px}
.note{border:3px solid var(--ink);background:var(--soft);padding:8px 10px;margin-top:10px;cursor:pointer}
.note b{font-family:'VT323',monospace;font-size:20px}
.deco{position:fixed;z-index:0;font-family:'Press Start 2P';color:#fff;opacity:.8;pointer-events:none;text-shadow:2px 2px 0 var(--pink)}
body{padding-bottom:72px}
.bar{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.2) 0 4px,transparent 4px 8px),linear-gradient(90deg,var(--pink),var(--blue))}
.body{background-image:radial-gradient(var(--line) 1.3px,transparent 1.5px);background-size:14px 14px}

.dt{margin-top:10px;font-size:14px;line-height:1.7;background:var(--soft);border:3px dashed var(--ink);padding:6px 10px}
.mas svg{display:block;filter:drop-shadow(2px 0 0 var(--ink)) drop-shadow(-2px 0 0 var(--ink)) drop-shadow(0 2px 0 var(--ink)) drop-shadow(0 -2px 0 var(--ink))}
.mas{padding:4px}
.hj>*{height:18px!important;font-family:'VT323',monospace;font-size:15px;opacity:.75;color:var(--ink)}
.cl{position:fixed;left:0;z-index:0;opacity:.75;pointer-events:none;animation:drift var(--du) linear infinite alternate}
@keyframes drift{from{transform:translateX(-12vw)}to{transform:translateX(100vw)}}
.deco{animation:bl 2s steps(2) infinite}@keyframes bl{50%{opacity:.25}}
.task{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(90deg,var(--pink),var(--blue));border-top:3px solid var(--ink);padding:5px 10px calc(5px + env(safe-area-inset-bottom,0px));color:#fff;text-shadow:1px 1px 0 var(--ink);font-weight:800}
.task .start{background:var(--paper);color:var(--ink);text-shadow:none;border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:2px 8px;font-family:'Press Start 2P',monospace;font-size:9px}
.task #tk{font-family:'VT323',monospace;font-size:19px;direction:ltr}
.ts{position:fixed;left:50%;bottom:64px;z-index:9;transform:translate(-50%,30px);opacity:0;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--pink);padding:8px 14px;font-weight:800;transition:all .25s steps(4);pointer-events:none;text-align:center}
.ts.on{opacity:1;transform:translate(-50%,0)}
.sb{display:grid;grid-template-columns:120px 1fr 74px 20px;gap:6px;align-items:center;margin-bottom:8px;font-weight:800;font-size:13px}
.pb{height:18px;border:3px solid var(--ink);background:var(--paper)}.pb div{height:100%}
:root{--ink:#2b2457;--paper:#f4f3e6;--soft:#dcebd6;--pink:#ee6aa7;--blue:#6f7be0;--g1:#2a1d5c;--g2:#5b3b95;--g3:#c8639f;--line:#c3d8bd;--grid:rgba(255,255,255,.06)}
.win{box-shadow:0 0 0 4px #f4a8c7,6px 6px 0 4px #17103a}
.tab{background:#b9a6ea}.tab.on{background:var(--paper)}
.cl{opacity:.16}
.pi{image-rendering:pixelated}.hn img,.legend img{vertical-align:middle}
.av{width:64px;height:64px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--pink);display:block}
.c.no{background:#ffd0d0;color:#c03050;border-color:#c03050}
.ov{position:fixed;inset:0;z-index:20;background:rgba(20,12,50,.65);display:none;align-items:center;justify-content:center;padding:16px}.ov.on{display:flex}.dlg{width:100%;max-width:340px;margin:0}
.btn.yes{background:#7ad3a6}.btn.no{background:#ff9a9a}
.ic button img{display:block}
.tg{border:3px solid var(--ink);border-radius:18px;background:var(--soft);box-shadow:0 0 0 4px #f4a8c7,5px 5px 0 4px #17103a;padding:10px;margin:6px 6px 26px}
.tgh{display:flex;justify-content:space-between;align-items:center;border-bottom:3px dotted var(--ink);padding-bottom:6px}.hr{color:var(--pink);font-size:20px;letter-spacing:2px}
.tgimg{display:flex;gap:12px;align-items:center;border:3px dotted var(--ink);background:var(--paper);padding:8px;margin:8px 0}.tgimg img{width:96px;height:96px;border:3px solid var(--ink)}
.st{display:grid;grid-template-columns:90px 1fr 56px;gap:6px;align-items:center;font-size:13px;font-weight:800;margin:5px 0}
.tgrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-top:10px}
.hb{border:3px solid var(--ink);border-radius:10px;background:#f6c9de;text-align:center;padding:5px;font-size:12px;font-weight:800}.hb img{width:36px;height:36px;display:block;margin:0 auto 3px}
.mb{display:flex;gap:4px;align-items:flex-end;height:54px;margin-top:10px}.mb i{flex:1;background:var(--pink);border:2px solid var(--ink);display:block}
.vg{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:10px}.vg img{width:100%;aspect-ratio:1;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--pink);display:block}
.ic{max-height:150px;overflow:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>

<script>
const COL=['#ee6aa7','#6f7be0','#a07be0','#f2a65a','#4cc79a','#ef6b6b','#f2cf55'];
const EM=['💧','📖','🏃','🌙','🦷','🌸','⭐','🎮'];
const MN=['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
const MO=['😊','😌','😐','😢','😴'];
let S={habits:[{id:1,name:'الاستيقاظ مبكرًا',emoji:'🌙'},{id:2,name:'شرب ٢ لتر ماء',emoji:'💧'},{id:3,name:'القراءة',emoji:'📖'},{id:4,name:'الرياضة',emoji:'🏃'},{id:5,name:'تنظيف الأسنان',emoji:'🦷'}],checks:{},start:{},goal:3,notes:{},nid:6};
try{const r=localStorage.getItem('hq1');if(r)S=JSON.parse(r)}catch(e){}
S.study=S.study||{subs:[{id:1,name:'اللغة الإنجليزية',emoji:'🔤'}],log:{},goal:60,nid:2};
let ssub=S.study.subs[0]?S.study.subs[0].id:0;
const save=()=>{try{localStorage.setItem('hq1',JSON.stringify(S))}catch(e){}};
const now=new Date();let Y=now.getFullYear(),M=now.getMonth(),pick='⭐',mood='😊',nday=now.getDate();
const $=i=>document.getElementById(i);
const key=()=>Y+'-'+M, dim=()=>new Date(Y,M+1,0).getDate();
const isCur=()=>Y===now.getFullYear()&&M===now.getMonth();
const last=()=>isCur()?now.getDate():(new Date(Y,M,1)>now?0:dim());
const st=()=>S.start[key()]||1;
const chk=id=>((S.checks[key()]||{})[id])||[];
const cnt=d=>S.habits.filter(h=>chk(h.id).includes(d)).length;
const goal=()=>Math.max(1,Math.min(S.goal,S.habits.length||1));
function toggle(id,d){if(d<st()||d>last())return;const k=key();S.checks[k]=S.checks[k]||{};let a=S.checks[k][id]||[];const was=a.includes(d);S.checks[k][id]=was?a.filter(x=>x!==d):[...a,d];save();render();if(!was&&cnt(d)===goal())toast('LEVEL UP ✦ حققتِ هدف اليوم!')}
function ph(c,s){const R=['.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...'];let o='';R.forEach((r,y)=>[...r].forEach((v,x)=>{if(v==='X')o+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}));return `<svg width="${s}" height="${s*6/7}" viewBox="0 0 7 6" fill="${c}" shape-rendering="crispEdges" aria-hidden="true">${o}</svg>`}
function render(){
 const n=dim(),L=last(),s=st(),g=goal();
 $('mt').innerHTML=ph('#ff7eb6',22)+' '+MN[M]+' '+Y;
 let ticks=0,hit=0,sumMin=0,el=Math.max(0,L-s+1);
 for(let d=s;d<=L;d++){const c=cnt(d);ticks+=c;sumMin+=Math.min(c,g);if(c>=g)hit++}
 let streak=0;for(let d=L;d>=s&&cnt(d)>=g;d--)streak++;
 const pct=el?Math.round(sumMin/(g*el)*100):0;
 $('xp').style.width=pct+'%';$('lv').textContent='LV '+(Math.floor(ticks/10)+1)+'  XP '+pct+'%';
 $('s1').textContent=(isCur()?now.getDate():L)+' / '+n;$('s2').textContent=hit;$('s3').textContent=streak;
 $('st').innerHTML=Array.from({length:n},(_,i)=>`<option ${i+1===s?'selected':''}>${i+1}</option>`).join('');
 $('gv').textContent=g;
 $('ic').innerHTML=EM.map(e=>`<button data-e="${e}" class="${e===pick?'on':''}">${e}</button>`).join('');
 grid(n,L,s);chart(n,L,s,g);radial(n,L,s);notes(n);study(n);dates(n);
}
function grid(n,L,s){
 if(!S.habits.length){$('grid').innerHTML='<div class="empty">'+ph('#ff7eb6',30)+'<br>ما في عادات بعد. أضيفي أول عادة وابدأي اللعبة!</div>';return}
 const dn=isCur()?now.getDate():0;let h=`<div class="row" style="--n:${n}"><div class="hn">اليوم</div>`;
 for(let d=1;d<=n;d++)h+=`<div class="dh ${d===dn?'t':''}">${d}</div>`;h+='</div>';h+=`<div class="row hj" style="--n:${n}"><div class="hn">هجري</div>${Array.from({length:n},(_,i)=>`<div>${hd(new Date(Y,M,i+1))}</div>`).join('')}</div>`;
 S.habits.forEach((b,i)=>{h+=`<div class="row" style="--n:${n}"><div class="hn"><span>${b.emoji} ${b.name}</span><button class="x" data-del="${b.id}" aria-label="حذف">×</button></div>`;
  const a=chk(b.id);for(let d=1;d<=n;d++){const on=a.includes(d),cl=on?'on':d<s?'off':d>L?'fut':'';h+=`<div><button class="c ${cl}" style="--c:${COL[i%7]}" data-h="${b.id}" data-d="${d}" aria-label="يوم ${d}">${on?'♥':''}</button></div>`}h+='</div>'});
 $('grid').innerHTML=h;
}
function chart(n,L,s,g){
 const W=Math.max(640,n*22+50),H=270,pl=32,pr=14,pt=18,pb=26,m=S.habits.length||1,sx=(W-pl-pr)/Math.max(1,n-1),X=d=>pl+(d-1)*sx,Y_=c=>pt+(H-pt-pb)*(1-c/m);
 let o=`<svg dir="ltr" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
 for(let c=0;c<=m;c++)o+=`<line x1="${pl}" x2="${W-pr}" y1="${Y_(c)}" y2="${Y_(c)}" stroke="var(--line)" stroke-width="2"/><text x="${pl-8}" y="${Y_(c)+4}" text-anchor="end" font-size="16" fill="var(--ink)">${c}</text>`;
 for(let d=1;d<=n;d++)o+=`<text x="${X(d)}" y="${H-8}" text-anchor="middle" font-size="15" fill="var(--ink)">${d}</text>`;

function qs(id,ds){let t=0,u='';ds.forEach(d=>{const q=String(det(id,d).q||''),m=q.match(/[\d.]+/);if(m){t+=parseFloat(m[0]);if(!u)u=q.replace(m[0],'').trim()}});return t?(Math.round(t*10)/10)+(u?' '+u:''):''}

 const n=dim(),L=last(),s=st(),g=goal(),T=S.study,lg=T.log[key()]||{},H=S.habits;let o='';
 const sm=d=>T.subs.reduce((a,x)=>a+((lg[x.id]||{})[d]||0),0),hm=m=>Math.floor(m/60)+'h'+m%60+'m';
 for(let a=1;a<=n&&a<=L;a+=7){const b=Math.min(a+6,n),ds=[];for(let d=Math.max(a,s);d<=Math.min(b,L);d++)ds.push(d);
  const fin=b<=L,per=H.map(h=>({h,n:ds.filter(d=>chk(h.id).includes(d)).length,m:ds.reduce((x,d)=>x+(det(h.id,d).m||0),0),q:qs(h.id,ds)})),done=per.reduce((x,p)=>x+p.n,0),pct=Math.round(done/Math.max(1,H.length*ds.length)*100),best=per.slice().sort((x,y)=>y.n-x.n)[0],sd=ds.reduce((x,d)=>x+sm(d),0),hit=ds.filter(d=>cnt(d)>=g).length,hs=Math.round(pct/20),star=best&&best.n>0;
  o+=`<div class='tg'><div class='tgh'><span class='hr'>${'♥'.repeat(hs)}<span style='opacity:.3'>${'♥'.repeat(5-hs)}</span></span><img class='pi' width='34' height='34' src='${IM[GAL[Math.ceil(a/7)*2%GAL.length]]}' alt=''><span class='px'>WEEK ${Math.ceil(a/7)}</span><span class='px'>Lv.${Math.floor(done/5)+1}</span></div>
<div style='margin:8px 0;font-weight:800'>${a}–${b} / ${M+1} · ${fin?'تقريرك جاهز ✨':'جاري تجهيز تقريرك… '+Math.round(ds.length/(b-a+1)*100)+'%'}</div>
<div class='tgimg'><img class='pi' src='${IM[star?ik(best.h):'girl']}' alt=''><div><div class='px' style='font-size:9px'>STAR</div><b>${star?best.h.name:'ابدأي أول عادة'}</b><div>${best?best.n:0} / ${ds.length} يوم</div></div></div>
<div class='st'><span>عاداتي</span><div class='pb'><div style='width:${pct}%;background:var(--pink)'></div></div><span class='num'>${pct}%</span></div>
<div class='st'><span>دراسة</span><div class='pb'><div style='width:${Math.min(100,sd/(T.goal*Math.max(1,ds.length))*100)}%;background:var(--blue)'></div></div><span class='num'>${hm(sd)}</span></div>
<div class='st'><span>أيام الهدف</span><div class='pb'><div style='width:${hit/Math.max(1,ds.length)*100}%;background:#4cc79a'></div></div><span class='num'>${hit}/${ds.length}</span></div>
<div class='tgrow'>${per.map(p=>`<div class='hb'>${ic(p.h,36)}${p.h.name}<br>${p.n}/${ds.length}${p.m?' · '+p.m+'د':''}${p.q?'<br>'+p.q:''}</div>`).join('')}<div class='hb'><img class='pi' src='${IM.book}' alt=''>دراسة<br>${hm(sd)}</div></div>
<div class='mb'>${Array.from({length:b-a+1},(_,i)=>`<i style='height:${Math.max(8,cnt(a+i)/(H.length||1)*100)}%'></i>`).join('')}</div></div>`}
 $('p6').innerHTML=o||"<div class='empty'>التقرير بيظهر أول ما يبدأ الأسبوع.</div>"}
function dates(n){const t=new Date(),q={};HN.formatToParts(t).forEach(x=>q[x.type]=x.value);$('dt').innerHTML=`<span class='px' style='font-size:11px'>${t.getDate()}/${t.getMonth()+1}</span> ⇄ <span class='px' style='font-size:11px'>${q.day}/${q.month} هـ</span>`;tick()}
function post(){
 $('mas').innerHTML=`<img class='pi av' src='${IM.girl}' alt=''>`;
 $('ic').innerHTML=IK.map(k=>`<button data-e='${k}' class='${k===pick?'on':''}'><img class='pi' width='26' height='26' src='${IM[k]}' alt=''></button>`).join('');
 $('lg').innerHTML=S.habits.map((b,i)=>`<span style='--k:${COL[i%7]}'>${ic(b,16)} ${b.name}</span>`).join('');
 const n=dim();bars('hmc',S.habits.map((b,i)=>({c:COL[i%7],v:Object.fromEntries(Array.from({length:n},(_,j)=>[j+1,det(b.id,j+1).m||0]))})),n,0);
 const AD=Array.from({length:n},(_,i)=>i+1);$('hlg').innerHTML=S.habits.map((b,i)=>`<span style='--k:${COL[i%7]}'>${ic(b,16)} ${b.name}: ${qs(b.id,AD)||'–'} · ${AD.reduce((x,d)=>x+(det(b.id,d).m||0),0)}د</span>`).join('');report()}
const _r=render;render=function(){_r();post()};
$('tabs').insertAdjacentHTML('beforeend','<button class="tab" data-t="p6">تقريري</button>');
$('p5').insertAdjacentHTML('afterend','<div class="pane" id="p6"></div>');
$('p2').insertAdjacentHTML('beforeend','<h3 class="px" style="font-size:10px;margin:16px 0 8px">MINUTES</h3><div class="chartbox"><div id="hmc"></div></div><div class="legend" id="hlg"></div>');
(function(){let o='',x=0,sd=7;const r=()=>(sd=sd*16807%2147483647)/2147483647;while(x<160){const w=6+Math.floor(r()*9),h=14+Math.floor(r()*40);o+=`<rect x='${x}' y='${60-h}' width='${w}' height='${h}' fill='#241650'/>`;for(let wy=60-h+3;wy<57;wy+=5)for(let wx=x+2;wx<x+w-2;wx+=4)if(r()>.6)o+=`<rect x='${wx}' y='${wy}' width='2' height='2' fill='#ffd9a0'/>`;x+=w+1}
 $('sky').insertAdjacentHTML('beforeend',`<svg style='position:fixed;left:0;right:0;bottom:38px;width:100%;height:110px;opacity:.55;pointer-events:none' viewBox='0 0 160 60' preserveAspectRatio='xMidYMax slice' shape-rendering='crispEdges'>${o}</svg>`)})();
render();
 
let installPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  installPrompt = e;

  let btn = document.getElementById('installApp');

  if (!btn) {
    btn = document.createElement('button');
    btn.id = 'installApp';
    btn.textContent = '⬇ تثبيت HABIT QUEST';
    btn.className = 'btn main';
    btn.style.cssText =
      'position:fixed;top:12px;right:12px;z-index:9999;';
    document.body.appendChild(btn);
  }

  btn.hidden = false;

  btn.onclick = async () => {
    if (!installPrompt) return;

    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt = null;
    btn.remove();
  };
});

window.addEventListener('appinstalled', () => {
  document.getElementById('installApp')?.remove();
});
  
</script><script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script></body></html>
